services:
  discord-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # 서버가 하나로 고정된 배포라면 설정해 두면 guild_id 인자를 생략할 수 있다.
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - discord-mcp-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - discord-mcp-network

  # 개발용 Redis Commander (선택사항)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - discord-mcp-network
    profiles:
      - dev

volumes:
  redis_data:

networks:
  discord-mcp-network:
    driver: bridge
