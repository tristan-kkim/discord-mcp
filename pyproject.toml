[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-mcp"
version = "2.1.0"
description = "Model Context Protocol server for Discord"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "discord", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "mcp>=2.2.0",
    "aiohttp>=3.14.3",
    "pydantic>=2.13.5",
    "loguru>=0.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1",
]

[project.scripts]
discord-mcp = "discord_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/tristan-kkim/discord-mcp"
Issues = "https://github.com/tristan-kkim/discord-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["discord_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
